name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-portable.yml"
      - "README.md"
      - "scripts/package-windows-portable.ps1"
      - "app/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $manifest = "app/Cargo.toml"
          $version = (Select-String -Path $manifest -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: cargo test --manifest-path app/Cargo.toml

      - name: Build portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package-windows-portable.ps1

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Countdown-v${{ steps.package.outputs.version }}-windows-portable
          path: dist-packages/windows/Countdown-v${{ steps.package.outputs.version }}-windows-portable.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $tag = "v$version"
          $asset = "dist-packages/windows/Countdown-v$version-windows-portable.zip"
          $notes = @"
          ## 下载

          - Windows portable: Countdown-v$version-windows-portable.zip

          ## v$version

          - 使用 Slint 重构为原生 Rust 桌面 UI，不再使用 WebView/网页前端
          - 保留本地 JSON 数据、备份恢复、Bark 推送和开机启动设置
          - Windows workflow 自动打包并发布 Release

          ## 验证

          - GitHub Actions: Build Windows Portable 通过
          - Commit: ${{ github.sha }}
          "@

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo "${{ github.repository }}" --clobber
          } else {
            gh release create $tag $asset --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Countdown $tag" --notes $notes
          }
