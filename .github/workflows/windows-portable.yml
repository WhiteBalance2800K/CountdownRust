name: Build Windows Portable

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-portable.yml"
      - "index.html"
      - "package-lock.json"
      - "package.json"
      - "scripts/package-windows-portable.ps1"
      - "src/**"
      - "src-tauri/**"
      - "tsconfig*.json"
      - "vite.config.ts"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build portable zip
        shell: pwsh
        run: npm run package:windows

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Countdown-v0.9-windows-portable
          path: dist-packages/windows/Countdown-v0.9-windows-portable.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $minor = $version -replace '\.0$', ''
          $asset = "dist-packages/windows/Countdown-v$minor-windows-portable.zip"
          $notes = @"
          ## 下载

          - Windows portable: Countdown-v$minor-windows-portable.zip

          ## 验证

          - GitHub Actions: Build Windows Portable 通过
          - Commit: ${{ github.sha }}
          "@

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo "${{ github.repository }}" --clobber
          } else {
            gh release create $tag $asset --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Countdown $tag" --notes $notes
          }
